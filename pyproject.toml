[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitpredict"
version = "0.1.0"
description = "Leakage-aware Billboard Hot 100 hit prediction from pre-outcome Spotify audio features"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.9",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.6.1",
  "scipy==1.17.1",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
app = ["streamlit==1.65.0"]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.3",
  "ruff==0.15.5",
]

[project.scripts]
hitpredict = "hitpredict.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = true
check_untyped_defs = true
